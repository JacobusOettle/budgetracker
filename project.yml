name: Spaar
options:
  bundleIdPrefix: com.jacobusoettle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Spaar:
    type: application
    platform: iOS
    sources: [Spaar]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobusoettle.spaar
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spaar
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Spaar/Info.plist
        # iCloud sync. Needs the iCloud (CloudKit) capability on the App ID with this
        # container; see README "iCloud sync". CI builds without signing blank it.
        SPAAR_CLOUDKIT_CONTAINER: iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
        CODE_SIGN_ENTITLEMENTS: Spaar/Spaar.entitlements
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Lets Spaar reach an AI model running on your own computer, such as Ollama or LM Studio."
  SpaarTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SpaarTests]
    dependencies:
      - target: Spaar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobusoettle.spaar.tests
        GENERATE_INFOPLIST_FILE: YES
  SpaarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SpaarUITests]
    dependencies:
      - target: Spaar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobusoettle.spaar.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Spaar
schemes:
  Spaar:
    build:
      targets:
        Spaar: all
        SpaarTests: [test]
    test:
      targets: [SpaarTests]
  Screenshots:
    build:
      targets:
        Spaar: all
        SpaarUITests: [test]
    test:
      targets: [SpaarUITests]
