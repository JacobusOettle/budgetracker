name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.BUILD_PROVISION_PROFILE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          gem list -i xcpretty >/dev/null || sudo gem install xcpretty
          xcodegen generate

      - name: Run unit tests
        run: |
          UDID=$(ci/pick_simulator.sh)
          echo "Testing on simulator $UDID"
          set -o pipefail
          xcodebuild test \
            -project Spaar.xcodeproj \
            -scheme Spaar \
            -destination "id=$UDID" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            SPAAR_CLOUDKIT_CONTAINER= CODE_SIGN_ENTITLEMENTS= \
            | xcpretty

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/TestResults.xcresult
          if-no-files-found: ignore

      - name: Build unsigned IPA
        run: ci/build_unsigned_ipa.sh build/out

      - name: Capture Shortcuts screenshots (best effort)
        continue-on-error: true
        run: |
          UDID=$(ci/pick_simulator.sh)
          xcrun simctl boot "$UDID" || true
          xcrun simctl ui "$UDID" appearance dark || true
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --batteryState charged || true
          xcodebuild test \
            -project Spaar.xcodeproj \
            -scheme Screenshots \
            -destination "id=$UDID" \
            -resultBundlePath build/Screens.xcresult \
            CODE_SIGNING_ALLOWED=NO SPAAR_CLOUDKIT_CONTAINER= CODE_SIGN_ENTITLEMENTS= | xcpretty || true
          mkdir -p build/screens
          xcrun xcresulttool export attachments --path build/Screens.xcresult --output-path build/screens || true
          ls -la build/screens || true

      - name: Upload Shortcuts screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shortcuts-screenshots
          path: build/screens
          if-no-files-found: ignore

      - name: Build signed IPA
        if: env.HAS_SIGNING == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          EXPORT_METHOD: ${{ vars.EXPORT_METHOD || 'development' }}
        run: ci/build_signed_ipa.sh build/out

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Spaar-ipa
          path: build/out/*.ipa
          if-no-files-found: error

      - name: Clean up keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
